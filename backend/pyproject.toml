[project]
name = "talent-eval-agents"
version = "0.1.0"
description = "Multi-agent talent assessment and recommendation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "boto3>=1.40.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.4",
    "jq>=1.10.0",
    "langchain[mcp]>=1.4,<2",
    "langchain-core>=1.2,<2",
    "langchain-community>=0.4.1",
    "langgraph>=1.2.10",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "pypdf>=6.0.0",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "faster-whisper>=1.2.1",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.4.2",
    "dashscope>=1.26.6",
    "python-docx>=1.2.0",
    "pymilvus>=2.6,<2.7",
    "mcp[cli]>=2.2,<3",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "httpx2>=2.12,<3",
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_model: calls the configured external chat model and is skipped by default",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
